# Docker Compose for Local PostgreSQL Database
# Part of My BI Project - dbt data warehouse environment
# 
# Environment variables required (set in your shell before running docker-compose up):
#   export DB_USER="dbt_user"
#   export DB_PASSWORD="strong_password_123!"
#   export DB_SEED_PASSWORD="seed_password_456!"

services:
  postgres:
    image: postgres:16-alpine
    container_name: my_bi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: my_bi_db
      POSTGRES_USER: ${DB_USER:-dbt_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-strong_password_123!}
      POSTGRES_INITDB_ARGS: "-E utf8 --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dbt_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bi_project_network

volumes:
  postgres_data:
    driver: local

networks:
  bi_project_network:
    driver: bridge