# dbt profiles.yml for local Postgres BI project
# This file configures the connection to your local PostgreSQL database

my_bi_project:
  target: dev
  outputs:
    dev:
      type: postgres
      host: localhost
      port: 5432
      dbname: my_bi_db
      schema: public
      user: "{{ env_var('DB_USER') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      sslmode: disable
      connect_timeout: 10
      
        
